[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zx-code"
version = "0.1.0"
description = "Local-first Python coding agent runtime with auditable tool execution and persistent sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "dahuangggg"}]
keywords = ["coding-agent", "cli", "mcp", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "pydantic>=2,<3",
  "rich>=13,<15",
  "typer>=0.12,<1",
  "openai>=1.30,<2",
  "tiktoken>=0.7,<1",
  "python-frontmatter>=1.1.0",
  "mcp>=1.0,<2",
  "pyyaml>=6.0",
  "chromadb>=1.5.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.urls]
Repository = "https://github.com/dahuangggg/zx-code"
Issues = "https://github.com/dahuangggg/zx-code/issues"
Documentation = "https://github.com/dahuangggg/zx-code/blob/main/README.md"

[project.scripts]
zx-code = "agent.main:main"
agent = "agent.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
