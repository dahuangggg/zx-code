name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    env:
      RUN_LIVE_MARKDOWN_STREAM: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest -q
      - run: uv run --locked zx-code --help
      - run: uv run --locked python examples/offline_demo.py --output .zx-code/artifacts/ci-demo
      - run: uv build
      - name: Check installed wheel without the source tree
        shell: bash
        run: |
          uv venv /tmp/zx-code-wheel-smoke
          uv pip install --python /tmp/zx-code-wheel-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/zx-code-wheel-smoke/bin/zx-code --help
          /tmp/zx-code-wheel-smoke/bin/agent --help
